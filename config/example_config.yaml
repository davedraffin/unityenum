workspace:
  docs_repo_path: "/Workspace/Repos/your-org/unity-catalog-docs"
  docs_output_path: "docs/unity-catalog"
  branch_prefix: "unity-docs"

azure_devops:
  organization_url: "https://dev.azure.com/your-org"
  project: "DataPlatform"
  repo: "unity-catalog-docs"
