resources:
  jobs:
    unity_catalog_docgen:
      name: unity-catalog-docgen
      tasks:
        - task_key: enumerate_catalogs
          notebook_task:
            notebook_path: /Workspace/Repos/your-org/unityenum/notebooks/01_enumerate_catalogs
          existing_cluster_id: "${var.cluster_id}"
        - task_key: crawl_permissions
          depends_on:
            - task_key: enumerate_catalogs
          notebook_task:
            notebook_path: /Workspace/Repos/your-org/unityenum/notebooks/02_crawl_permissions
          existing_cluster_id: "${var.cluster_id}"
        - task_key: generate_docs
          depends_on:
            - task_key: crawl_permissions
          notebook_task:
            notebook_path: /Workspace/Repos/your-org/unityenum/notebooks/03_generate_docs
          existing_cluster_id: "${var.cluster_id}"
        - task_key: publish_pr
          depends_on:
            - task_key: generate_docs
          notebook_task:
            notebook_path: /Workspace/Repos/your-org/unityenum/notebooks/04_publish_pr
          existing_cluster_id: "${var.cluster_id}"
